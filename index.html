<script>
(()=>{'use strict';
const DUR=60*60*1000,MAXV=5,KEY='bwl_exam_v2';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const $=id=>document.getElementById(id);
const L=['Beginner','Intermediate','Advanced'],LC=['','i','a'];

/* ---------- Questions (hidden tests live only inside this closure) ---------- */
const M=(q,o,a,c,why)=>({t:'m',q,o,a,c,why});
const C=(lv,title,desc,mode,ex,starter,ref,tests,x={})=>({t:'c',lv,m:lv+1,title,desc,mode,ex,starter,ref,tests,...x});
const Q=[
M('What is the value of 5 & 3?',['1','2','7','6'],0,'`&` keeps a bit only when both bits are 1. Example with other numbers: 6 & 3 → 110 & 011 = 010 → 2.','0101 AND 0011 = 0001, which is 1.'),
M('What is the result of 5 ^ 3?',['1','6','7','8'],1,'`^` (XOR) gives 1 where the bits differ. Example: 6 ^ 3 → 110 ^ 011 = 101 → 5.','0101 XOR 0011 = 0110, which is 6.'),
M('What is the value of 3 << 2?',['6','8','12','16'],2,'`x << k` multiplies x by 2**k. Example: 5 << 1 → 10 and 1 << 4 → 16.','Shifting left by 2 multiplies by 4, so 3 << 2 = 12.'),
M('In Python, what is the result of ~5?',['5','-5','-6','6'],2,'For Python integers, `~x` equals `-x - 1`. Example: ~7 → -8 and ~(-1) → 0.','~5 = -5 - 1 = -6.'),
M('Which expression checks whether integer n is odd?',['(n & 1) == 0','(n | 1) == 0','(n ^ 1) == 0','(n & 1) == 1'],3,'The lowest bit shows parity. Example: 6 = 110 (lowest bit 0, even); 7 = 111 (lowest bit 1, odd).','The lowest bit of an odd number is 1, so (n & 1) == 1.'),
C(0,'Evaluate AND, OR and XOR','Evaluate `6 & 3`, `6 | 3` and `6 ^ 3`, then print the three results, one per line, in that order. No input is read.','prog',
 [['','2\n7\n5']],'# Print the three results, one per line\n','print(6&3);print(6|3);print(6^3)',['']),
C(0,'Three basic operators','Read two integers `a` and `b` (one per line). Print `a & b`, `a | b` and `a ^ b`, each on its own line.','prog',
 [['6\n3','2\n7\n5'],['12\n10','8\n14\n6']],'a = int(input())\nb = int(input())\n# Print AND, OR and XOR\n','a=int(input());b=int(input());print(a&b);print(a|b);print(a^b)',['6\n3','0\n0','255\n15','-5\n3','1023\n1024','100\n7']),
C(0,'Left and right shift','Read an integer `n`. Print `n << 1` on the first line and `n >> 1` on the second. Right shift of a negative number rounds toward negative infinity.','prog',
 [['5','10\n2'],['-5','-10\n-3']],'n = int(input())\n# Print n << 1, then n >> 1\n','n=int(input());print(n<<1);print(n>>1)',['5','-5','0','1','-1','1024','-7']),
C(0,'Predict and verify','Given `a = 12` and `b = 10` (already set in the starter), print `a & b`, `a | b`, `a ^ b` and `a >> 2`, one per line. Predict each result in comments first (12 = 1100, 10 = 1010).','prog',
 [['','8\n14\n6\n3']],'a = 12\nb = 10\n# Predict first, then print four lines\n','a=12;b=10;print(a&b);print(a|b);print(a^b);print(a>>2)',['']),
C(0,'Odd or even without modulo','Write `is_odd(n)` that returns `True` if n is odd, else `False`, using a bitwise operator. The `%` operator and `divmod` are not allowed. It must return a real bool and work for negative numbers.','fn',
 [['is_odd(7)','True'],['is_odd(10)','False']],'def is_odd(n):\n    # Use a bitwise operator\n    pass\n','def is_odd(n): return (n&1)==1',['is_odd(7)','is_odd(10)','is_odd(0)','is_odd(-3)','is_odd(-4)','is_odd(1)','is_odd(10**12+1)'],{ban:/%|divmod/}),
C(1,'Power of two','Write `is_power_of_two(n)` returning `True` when n is a power of two (1, 2, 4, 8, …) and `False` otherwise, including for zero and negative numbers. Hint: a power of two has exactly one 1-bit.','fn',
 [['is_power_of_two(8)','True'],['is_power_of_two(12)','False'],['is_power_of_two(0)','False']],'def is_power_of_two(n):\n    # Handle zero and negative values\n    pass\n','def is_power_of_two(n): return n>0 and (n&(n-1))==0',['0']),
C(1,'Swap using XOR','Read integers `a` and `b` (one per line). Swap them using XOR, without a temporary variable or tuple assignment, then print them on one line separated by a space. (Ordinary tuple swap `a, b = b, a` is clearer in real code – mention this in a comment.)','prog',
 [['3\n7','7 3'],['-5\n10','10 -5']],'a = int(input())\nb = int(input())\n# Swap using ^\n\nprint(a, b)\n','a=int(input());b=int(input());a^=b;b^=a;a^=b;print(a,b)',['3\n7','-5\n10','0\n9','5\n5','100\n-100'],{need:/\^/}),
C(1,'Find the single number','Every value in the list appears twice except one. Write `single_number(nums)` that returns the unique value using XOR. Dictionaries, sets, `Counter` and `.count` are not allowed.','fn',
 [['single_number([4, 1, 2, 1, 2])','4'],['single_number([7])','7']],'def single_number(nums):\n    pass\n','def single_number(nums):\n    r=0\n    for v in nums: r^=v\n    return r',['[4,1,2,1,2]','[2,2,1]','[7]','[-1,3,3]','[0,5,5]','[9,8,9,8,100000]'].map(v=>`single_number(${v})`),{ban:/set\(|dict\(|\{|Counter|\.count/,need:/\^/}),
C(1,'Count set bits','Write `count_set_bits(n)` returning the number of 1-bits in a non-negative integer. `bin()`, `str()`, `format()`, f-strings and `.count` are not allowed.','fn',
 [['count_set_bits(13)','3'],['count_set_bits(255)','8'],['count_set_bits(0)','0']],'def count_set_bits(n):\n    pass\n','def count_set_bits(n):\n    c=0\n    while n: c+=n&1;n>>=1\n    return c',[0,1,2,7,13,255,1023,'2**40-1','2**64'].map(v=>`count_set_bits(${v})`),{ban:/bin\(|str\(|format\(|f["\']|\.count/}),
C(1,'Bit masks','Write `is_bit_set(n, k)`, `set_bit(n, k)` and `clear_bit(n, k)` for bit position k (0 = least-significant). `is_bit_set` returns a bool; the others return the new integer.','fn',
 [['(is_bit_set(10, 1), set_bit(10, 1), clear_bit(10, 1))','(True, 10, 8)'],['(is_bit_set(10, 2), set_bit(10, 2), clear_bit(10, 2))','(False, 14, 10)']],'def is_bit_set(n, k):\n    pass\n\ndef set_bit(n, k):\n    pass\n\ndef clear_bit(n, k):\n    pass\n','def is_bit_set(n,k): return (n>>k)&1==1\ndef set_bit(n,k): return n|(1<<k)\ndef clear_bit(n,k): return n&~(1<<k)',[[10,1],[10,2],[0,0],[255,7],[255,8],[1,0],[64,6],[5,31]].map(([n,k])=>`(is_bit_set(${n},${k}), set_bit(${n},${k}), clear_bit(${n},${k}))`)),
C(2,'Find the differing bit','Given integers `a` and `b`, return the position (from 0) of their only differing bit. Return `None` if they differ in zero bits or in more than one bit.','fn',
 [['differing_bit(4, 5)','0'],['differing_bit(4, 7)','None'],['differing_bit(8, 8)','None']],'def differing_bit(a, b):\n    pass\n','def differing_bit(a,b):\n    x=a^b\n    return x.bit_length()-1 if x and x&(x-1)==0 else None',[[4,5],[4,7],[8,8],[0,1],[16,0],[5,1],[255,127],[6,3],[1023,511]].map(([a,b])=>`differing_bit(${a},${b})`)),
C(2,'Next power of two','For `n >= 0`, return the smallest power of two strictly greater than n. If n is already a power of two, return the next one. Defined result: `next_power_of_two(0)` returns 1.','fn',
 [['next_power_of_two(9)','16'],['next_power_of_two(8)','16'],['next_power_of_two(0)','1']],'def next_power_of_two(n):\n    pass\n','def next_power_of_two(n): return 1<<n.bit_length()',[0,1,2,3,4,5,8,9,1023,1024,'10**6'].map(v=>`next_power_of_two(${v})`)),
C(2,'Find the missing number','`nums` holds distinct integers from 0 to n (n = len(nums)) with exactly one missing. Return the missing value using XOR in O(n) time and O(1) extra space. `sum`, `set` and `sorted` are not allowed.','fn',
 [['missing_number([0, 1, 3, 4])','2'],['missing_number([1, 2, 3])','0'],['missing_number([0, 1, 2, 3])','4']],'def missing_number(nums):\n    pass\n','def missing_number(nums):\n    r=len(nums)\n    for i,x in enumerate(nums): r^=i^x\n    return r',['[0,1,3,4]','[1,2,3]','[0,1,2,3]','[0]','[1]','[3,0,1]','[9,6,4,2,3,5,7,0,1]','[0,2]'].map(v=>`missing_number(${v})`),{ban:/sum\(|set\(|sorted\(/,need:/\^/}),
C(2,'Reverse the lowest k bits','Write `reverse_low_k_bits(n, k)` that reverses the order of the lowest k bits of n and leaves higher bits unchanged. Raise `ValueError` if k < 0. Explain your approach in comments.','fn',
 [['reverse_low_k_bits(0b1011, 3)','14'],['reverse_low_k_bits(1, 4)','8'],['reverse_low_k_bits(5, -1)','raises ValueError']],'def reverse_low_k_bits(n, k):\n    # Explain your approach here\n    pass\n','def reverse_low_k_bits(n,k):\n    if k<0: raise ValueError("k")\n    r=0\n    for i in range(k): r=(r<<1)|((n>>i)&1)\n    return (n>>k<<k)|r',[[13,3],[11,3],[1,4],[0,5],[255,0],[255,1],[53,6],[1027,4],[5,-1]].map(([n,k])=>`_t(lambda: reverse_low_k_bits(${n},${k}))`)),
C(2,'Two unique numbers','Exactly two distinct values occur once; every other value occurs twice. Return both unique values as a sorted list `[a, b]`, in O(n) time and O(1) extra space using XOR.','fn',
 [['two_unique([1, 2, 1, 3, 2, 5])','[3, 5]'],['two_unique([5, 6])','[5, 6]']],'def two_unique(nums):\n    pass\n','def two_unique(nums):\n    x=0\n    for v in nums: x^=v\n    low=x&-x;a=b=0\n    for v in nums:\n        if v&low: a^=v\n        else: b^=v\n    return sorted([a,b])',['[1,2,1,3,2,5]','[0,1]','[4,4,-2,7]','[10,20,10,30,20,40]','[1,1,2,2,3,100]','[5,6]','[9,9,8,8,7,7,1,2]'].map(v=>`two_unique(${v})`),{need:/\^/})
];
Q.forEach(q=>{if(q.t==='c')q.tests=q.tests.map(String)});
Q[10].tests=[0,1,2,3,8,12,-4,1024,1023,'2**40','2**40+1',-1].map(v=>`is_power_of_two(${v})`);

/* ---------- Python runner (Web Worker + Pyodide, 5 s limit per run) ---------- */
const DRV=String.raw`
import sys,io,json,builtins,traceback
def run_json(a):
    m=json.loads(a);return run(m['src'],m['stdin'],m['expr'])
def _t(f):
    try: return f()
    except Exception as e: return 'raises '+type(e).__name__
def run(src,stdin,expr):
    lines=iter(stdin.split('\n') if stdin else [])
    def _inp(p=''):
        try: return next(lines)
        except StopIteration: raise EOFError('input() called but there is no more input')
    oi,oo=builtins.input,sys.stdout
    builtins.input=_inp;buf=io.StringIO();sys.stdout=buf
    g={'__name__':'__main__','_t':_t}
    try:
        exec(compile(src,'<solution>','exec'),g)
        res=repr(eval(expr,g)) if expr else None
        return json.dumps({'ok':True,'out':buf.getvalue(),'res':res})
    except BaseException as e:
        fr=[f for f in traceback.extract_tb(e.__traceback__) if f.filename=='<solution>']
        ln=fr[-1].lineno if fr else getattr(e,'lineno',None)
        return json.dumps({'ok':False,'out':buf.getvalue(),'err':type(e).__name__+': '+str(e)+(' (line %s)'%ln if ln else '')})
    finally:
        builtins.input,sys.stdout=oi,oo
`;
const WSRC=`const D=${JSON.stringify(DRV)};let py;
(async()=>{try{importScripts('https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js');py=await loadPyodide();py.runPython(D);postMessage({ready:true})}catch(e){postMessage({ready:false,err:'Python runtime could not load. Check your internet connection and reload.'})}})();
onmessage=e=>{py.globals.set('_a',JSON.stringify(e.data));postMessage({id:e.data.id,r:py.runPython('run_json(_a)')})};`;
let W=null,seq=0;
function spawn(){const w=new Worker(URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'})));w.rdy=new Promise(r=>{w.onmessage=e=>r(e.data)});W=w}
async function exec(src,stdin,expr,ms=5000){
 if(!W)spawn();const w=W,st=await w.rdy;if(!st.ready){W=null;return{ok:false,err:st.err,out:''}}
 return new Promise(res=>{const id=++seq;
  const to=setTimeout(()=>{w.terminate();if(W===w)W=null;res({ok:false,out:'',err:'Time limit exceeded (5 s) – check for an infinite loop.',tle:true})},ms);
  w.onmessage=e=>{if(e.data.id!==id)return;clearTimeout(to);res(JSON.parse(e.data.r))};
  w.postMessage({id,src,stdin,expr})})}
const norm=s=>(s||'').split('\n').map(x=>x.replace(/\s+$/,'')).join('\n').replace(/\n+$/,'');

/* ---------- State ---------- */
let S=load()||null,timerH=null,busy=false,cur=0;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
const attempted=i=>{const q=Q[i];return q.t==='m'?S.mcq[i]!==undefined:(S.ans[i]!==undefined&&S.ans[i].trim()!==''&&S.ans[i].trim()!==q.starter.trim())};
const count=()=>Q.reduce((n,_,i)=>n+(attempted(i)?1:0),0);

/* ---------- Screens ---------- */
function start(){
 $('app').innerHTML=`<div class="center"><div class="card"><h1>Python Bitwise Challenge</h1><p style="color:var(--muted);margin:0">20 questions · 35 marks · 60 minutes</p>
 <label for="nm">Full name</label><input type="text" id="nm" maxlength="60" autocomplete="off"><label for="rid">Roll / candidate ID</label><input type="text" id="rid" maxlength="30" autocomplete="off">
 <h3 style="margin:20px 0 4px">Instructions</h3><ul class="rules"><li>Section A: 5 MCQs (1 mark each). Section B: 15 coding tasks worth 1, 2 or 3 marks by level; marks are proportional to hidden test cases passed.</li><li>Code runs as Python 3 in your browser. Each run has a 5-second limit. Use <b>Test examples</b> to check the visible samples; your answer is graded on additional hidden tests.</li><li>Stay in the exam tab and full screen. Switching tabs or leaving full screen is recorded; ${MAXV} violations auto-submit the exam. Pasting into the editor is disabled.</li><li>Your work saves automatically and the timer continues if you reload. The exam auto-submits when time ends.</li></ul>
 <label style="font-weight:400;display:flex;gap:8px;align-items:center"><input type="checkbox" id="agree"> I have read the instructions and will work on my own.</label><div class="err" id="serr"></div>
 <button class="b1" id="go" style="margin-top:8px;padding:12px 22px">Start exam</button></div></div>`;
 $('go').onclick=()=>{const n=$('nm').value.trim(),r=$('rid').value.trim();
  if(!n||!r)return $('serr').textContent='Enter your name and ID to continue.';
  if(!$('agree').checked)return $('serr').textContent='Tick the box to confirm the instructions.';
  S={cand:{n,r},end:Date.now()+DUR,mcq:{},ans:{},flag:{},viol:0,log:[],done:false,res:null};save();
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  run()}}
function run(){
 $('who').textContent=S.cand.n+' · '+S.cand.r;
 if(S.done)return result();
 shell();tick();timerH=setInterval(tick,1000);spawn()}
function shell(){
 $('app').innerHTML=`<div class="layout"><main class="card" id="qcard"></main><aside class="side"><div class="card"><h3>Progress</h3><div class="bar"><i id="pb"></i></div><div id="pl" style="font-size:13px"></div><div class="nav" id="nav" style="margin-top:10px"></div><div class="legend">Green = attempted · Orange dot = flagged · Blue outline = current</div></div><div class="card"><h3>Integrity log</h3><div style="font-size:13px" id="vl"></div><button class="b4" id="sub" style="width:100%;margin-top:10px;padding:11px">Submit exam</button></div></aside></div>`;
 $('nav').innerHTML=Q.map((_,i)=>`<button class="nb" id="nb${i}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join('');
 $('nav').onclick=e=>{const b=e.target.closest('.nb');if(b)go(+b.dataset.i)};
 $('sub').onclick=confirmSubmit;go(0)}
function side(){
 Q.forEach((_,i)=>{const b=$('nb'+i);b.classList.toggle('done',attempted(i));b.classList.toggle('cur',i===cur);b.classList.toggle('flag',!!S.flag[i])});
 const n=count();$('pb').style.width=n/20*100+'%';$('pl').textContent=n+' of 20 attempted';
 $('vl').textContent=S.viol+' of '+MAXV+' violations recorded'}
function go(i){cur=Math.max(0,Math.min(19,i));const q=Q[i=cur],c=$('qcard');
 const head=`<div class="qhead"><div><b>Question ${i+1}</b><span class="tag ${q.t==='c'?LC[q.lv]:''}">${q.t==='m'?'MCQ · 1 mark':L[q.lv]+' · '+q.m+(q.m>1?' marks':' mark')}</span></div><button class="b5" id="fl">${S.flag[i]?'Unflag':'Flag for review'}</button></div>`;
 const foot=`<div class="foot"><button class="b2" id="pv" ${i?'':'disabled'}>Previous</button><button class="b1" id="nx">${i<19?'Save and next':'Review and submit'}</button></div>`;
 if(q.t==='m'){
  c.innerHTML=head+`<div class="qbody"><h2>${esc(q.q)}</h2><div class="opts" role="radiogroup">${q.o.map((o,j)=>`<label class="opt ${S.mcq[i]===j?'sel':''}"><input type="radio" name="o" value="${j}" ${S.mcq[i]===j?'checked':''}> <b>${'ABCD'[j]}.</b> <code>${esc(o)}</code></label>`).join('')}</div><details><summary>Concept and example</summary><p style="margin:8px 0 0">${fmt(q.c)}</p></details></div>`+foot;
  c.querySelectorAll('input').forEach(r=>r.onchange=()=>{S.mcq[i]=+r.value;save();go(i)})}
 else{
  const ex=q.ex.map((e,k)=>q.mode==='prog'?`<div class="ex"><div class="l">Example ${k+1}</div><div class="l" style="background:#fff;font-weight:600">Input</div><pre>${esc(e[0]||'(none)')}</pre><div class="l" style="background:#fff;font-weight:600">Output</div><pre>${esc(e[1])}</pre></div>`:`<div class="ex"><div class="l">Example ${k+1}</div><pre>${esc(e[0])}\n→ ${esc(e[1])}</pre></div>`).join('');
  c.innerHTML=head+`<div class="qbody"><div class="split"><div><h2>${esc(q.title)}</h2><p style="margin:0">${fmt(q.desc)}</p><h3 style="font-size:14px;margin:16px 0 0">Examples</h3>${ex}<p style="font-size:13px;color:var(--muted)">Grading uses extra hidden test cases, including edge cases. Python 3 only.</p></div>
  <div><div class="edwrap"><div class="edbar"><span>Python 3 · solution.py</span><span id="pos">Ln 1, Col 1</span></div><div class="ed" id="ed"><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code editor"></textarea><div class="sug" id="sug"></div></div>
  ${q.mode==='prog'?`<textarea class="stdin" id="stdin" placeholder="Custom input for Run (one value per line)" aria-label="Program input"></textarea>`:''}
  <div class="runrow"><button class="b1" id="rn">▶ Run</button><button class="b3" id="te">Test examples</button><button class="b2" id="rs">Reset</button></div><div class="out" id="out" aria-live="polite"></div></div></div></div></div>`+foot;
  const ta=$('code');ta.value=S.ans[i]!==undefined?S.ans[i]:q.starter;if(q.mode==='prog')$('stdin').value=q.ex[0][0];
  editor(ta,i);$('rn').onclick=()=>runIt(i,false);$('te').onclick=()=>runIt(i,true);
  $('rs').onclick=()=>{if(confirm('Reset this answer to the starter code?')){delete S.ans[i];save();go(i)}}}
 $('fl').onclick=()=>{S.flag[i]=!S.flag[i];save();go(i)};$('pv').onclick=()=>go(i-1);$('nx').onclick=()=>i<19?go(i+1):confirmSubmit();side()}
async function runIt(i,samples){if(busy)return;const q=Q[i],o=$('out'),src=$('code').value;busy=true;$('rn').disabled=$('te').disabled=true;o.className='out show';o.textContent='Running…';
 try{
  if(!samples){const r=await exec(src,q.mode==='prog'?$('stdin').value:'',null);o.innerHTML=esc(r.out||'')+(r.err?`<span class="bad">\n${esc(r.err)}</span>`:'')||'(no output)'}
  else{let h='';for(let k=0;k<q.ex.length;k++){const e=q.ex[k],r=await exec(src,q.mode==='prog'?e[0]:'',q.mode==='fn'?(e[1].startsWith('raises')?`_t(lambda: ${e[0]})`:e[0]):null);
   const exp=q.mode==='fn'?(e[1].startsWith('raises')?`'${e[1]}'`:e[1]):norm(e[1]),got=r.ok?(q.mode==='fn'?r.res:norm(r.out)):r.err,ok=r.ok&&got===exp;
   h+=ok?`✓ Example ${k+1} passed\n`:`<span class="bad">✗ Example ${k+1}: expected ${esc(e[1])}, got ${esc(got)}</span>\n`}o.innerHTML=h}
 }finally{busy=false;$('rn').disabled=$('te').disabled=false}}

/* ---------- Editor with VS Code-style suggestions ---------- */
const KW='False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' ');
const BI='abs all any bin bool chr dict divmod enumerate filter float format hex input int isinstance len list map max min oct ord pow print range repr reversed round set sorted str sum tuple zip bit_length bit_count append'.split(' ');
const SN={def:'def name(args):\n    ',for:'for i in range(n):\n    ',while:'while condition:\n    ',if:'if condition:\n    ',ifelse:'if condition:\n    \nelse:\n    ',try:'try:\n    \nexcept Exception as e:\n    '};
function editor(ta,qi){const sug=$('sug');let items=[],sel=0;
 const pos=()=>{const v=ta.value.slice(0,ta.selectionStart).split('\n');$('pos').textContent='Ln '+v.length+', Col '+(v[v.length-1].length+1)};
 const ins=(t,s=ta.selectionStart,e=ta.selectionEnd,c)=>{ta.setRangeText(t,s,e,'end');if(c!==undefined)ta.selectionStart=ta.selectionEnd=c;ta.dispatchEvent(new Event('input'))};
 const word=()=>{const m=/[A-Za-z_]\w*$/.exec(ta.value.slice(0,ta.selectionStart));return m?m[0]:''};
 const hide=()=>{sug.style.display='none';items=[]};
 function show(){const w=word();if(!w)return hide();
  const ids=[...new Set(ta.value.match(/[A-Za-z_]\w*/g)||[])].filter(x=>x!==w);
  const all=[...Object.keys(SN).map(k=>[k,SN[k],'snippet']),...KW.map(k=>[k,k,'keyword']),...BI.map(k=>[k,k,'builtin']),...ids.map(k=>[k,k,'name'])];
  const seen=new Set();items=all.filter(a=>a[0].startsWith(w)&&a[0]!==w&&!seen.has(a[0]+a[2])&&seen.add(a[0]+a[2])).slice(0,7);if(!items.length)return hide();
  sel=0;draw();const d=document.createElement('div'),s=getComputedStyle(ta);['fontFamily','fontSize','lineHeight','padding','tabSize'].forEach(p=>d.style[p]=s[p]);
  d.style.cssText+=';position:absolute;visibility:hidden;white-space:pre;top:0;left:0';d.textContent=ta.value.slice(0,ta.selectionStart);const sp=document.createElement('span');sp.textContent='.';d.appendChild(sp);ta.parentNode.appendChild(d);
  sug.style.left=Math.min(sp.offsetLeft-ta.scrollLeft,ta.clientWidth-200)+'px';sug.style.top=(sp.offsetTop-ta.scrollTop+parseFloat(s.lineHeight)+2)+'px';d.remove();sug.style.display='block'}
 function draw(){sug.innerHTML=items.map((a,k)=>`<div class="${k===sel?'on':''}" data-k="${k}"><span>${esc(a[0])}</span><small>${a[2]}</small></div>`).join('')}
 function accept(){const a=items[sel],w=word();hide();ins(a[1],ta.selectionStart-w.length,ta.selectionStart)}
 sug.onmousedown=e=>{e.preventDefault();const d=e.target.closest('[data-k]');if(d){sel=+d.dataset.k;accept()}};
 ta.addEventListener('input',()=>{S.ans[qi]=ta.value;save();pos();show();side()});
 ta.addEventListener('click',()=>{pos();hide()});ta.addEventListener('keyup',pos);ta.addEventListener('blur',hide);ta.addEventListener('scroll',hide);
 ['paste','drop'].forEach(ev=>ta.addEventListener(ev,e=>{e.preventDefault();toast('Pasting and dropping text is disabled during the exam.')}));
 ta.addEventListener('keydown',e=>{const s=ta.selectionStart,v=ta.value;
  if(items.length){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:items.length-1))%items.length;return draw()}
   if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();return accept()}if(e.key==='Escape'){e.preventDefault();return hide()}}
  if(e.ctrlKey||e.metaKey)return;
  if(e.key==='Tab'){e.preventDefault();if(e.shiftKey){const ls=v.lastIndexOf('\n',s-1)+1,m=/^ {1,4}/.exec(v.slice(ls));if(m){ta.setRangeText('',ls,ls+m[0].length,'end');ta.selectionStart=ta.selectionEnd=Math.max(ls,s-m[0].length);ta.dispatchEvent(new Event('input'))}}else ins('    ')}
  else if(e.key==='Enter'){e.preventDefault();const line=v.slice(v.lastIndexOf('\n',s-1)+1,s),ind=/^ */.exec(line)[0];ins('\n'+ind+(/:\s*$/.test(line)?'    ':''))}
  else if('([{\'"'.includes(e.key)){const cl={'(':')','[':']','{':'}',"'":"'",'"':'"'}[e.key];e.preventDefault();if(ta.selectionStart!==ta.selectionEnd)return;if(v[s]===e.key&&"'\"".includes(e.key))return void(ta.selectionStart=ta.selectionEnd=s+1);ins(e.key+cl,s,s,s+1)}
  else if(')]}'.includes(e.key)&&v[s]===e.key){e.preventDefault();ta.selectionStart=ta.selectionEnd=s+1}
  else if(e.key==='Backspace'&&s===ta.selectionEnd&&s&&({'(':')','[':']','{':'}',"'":"'",'"':'"'})[v[s-1]]===v[s]){e.preventDefault();ta.setRangeText('',s-1,s+1,'end');ta.dispatchEvent(new Event('input'))}});
 pos()}

/* ---------- Timer, integrity, submit ---------- */
function tick(){const r=Math.max(0,S.end-Date.now()),t=$('timer');t.textContent=String(Math.floor(r/60000)).padStart(2,'0')+':'+String(Math.floor(r/1000)%60).padStart(2,'0');t.classList.toggle('low',r<=300000);if(r<=0){clearInterval(timerH);finish('Time expired')}}
function violate(why){if(!S||S.done||busy&&why==='x')return;S.viol++;S.log.push(why+' @ '+new Date().toLocaleTimeString());save();side();
 if(S.viol>=MAXV){toast('Violation limit reached. Submitting exam.');finish('Violation limit')}else toast(`Warning ${S.viol}/${MAXV}: ${why}. Stay in the exam window.`)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.done&&$('timer').offsetParent)violate('Left the exam tab')});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&S&&!S.done&&$('timer').offsetParent)violate('Exited full screen')});
document.addEventListener('contextmenu',e=>{if(S&&!S.done)e.preventDefault()});
document.addEventListener('copy',e=>{if(S&&!S.done&&!e.target.closest('#code'))e.preventDefault()});
window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
function confirmSubmit(){const u=20-count();$('mbox').innerHTML=`<h2>Submit exam?</h2><p>${u?`You have <b>${u}</b> unattempted question${u>1?'s':''}. `:'All questions attempted. '}You cannot change answers after submitting.</p><button class="b4" id="y">Submit now</button> <button class="b2" id="n">Keep working</button>`;$('modal').classList.add('open');$('y').onclick=()=>finish('Submitted by candidate');$('n').onclick=()=>$('modal').classList.remove('open')}
async function finish(reason){if(S.done||finish.on)return;finish.on=true;clearInterval(timerH);
 $('mbox').innerHTML='<h2>Grading…</h2><p id="gp">Running hidden test cases. This can take up to a minute.</p>';$('modal').classList.add('open');
 const rows=[];let tot=0;
 for(let i=0;i<20;i++){const q=Q[i];$('gp').textContent=`Grading question ${i+1} of 20…`;let r;
  if(q.t==='m'){const ok=S.mcq[i]===q.a;r={i,m:1,s:ok?1:0,p:ok?1:0,n:1,msg:S.mcq[i]===undefined?'Not answered':ok?'Correct':'Incorrect'}}
  else r=await grade(i);rows.push(r);tot+=r.s}
 S.done=true;S.res={rows,tot:Math.round(tot*100)/100,reason,at:new Date().toISOString()};save();finish.on=false;
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});result()}
async function grade(i){const q=Q[i],src=S.ans[i]||'',n=q.tests.length,z=m=>({i,m:q.m,s:0,p:0,n,msg:m});
 if(!attempted(i))return z('Not attempted');const code=src.replace(/#.*$/gm,'');
 if(q.ban&&q.ban.test(code))return z('Uses a construct the question forbids');if(q.need&&!q.need.test(code))return z('Required bitwise approach not used');
 let p=0,err='';for(const t of q.tests){const a=q.mode==='fn'?['',t]:[t,null];
  const e=await exec(q.ref,a[0],a[1]),g=await exec(src,a[0],a[1]);
  if(g.ok&&e.ok&&(q.mode==='fn'?g.res===e.res:norm(g.out)===norm(e.out)))p++;else if(!err)err=g.ok?'Wrong answer on a hidden test':g.err}
 return{i,m:q.m,s:Math.round(q.m*p/n*100)/100,p,n,msg:p===n?'All hidden tests passed':err}}
function result(){const R=S.res,max=35;$('mbox').innerHTML=`<h2>Exam submitted</h2><p style="margin:0;color:var(--muted)">${esc(S.cand.n)} · ${esc(S.cand.r)} · ${esc(R.reason)}</p><div class="big">${R.tot} / ${max}</div><p>Integrity violations: ${S.viol}</p>
 <table><tr><th>Q</th><th>Marks</th><th>Hidden tests</th><th>Result</th></tr>${R.rows.map(r=>`<tr><td>${r.i+1}</td><td>${r.s}/${r.m}</td><td>${r.p}/${r.n}</td><td class="${r.p===r.n?'ok':'no'}">${esc(r.msg)}</td></tr>`).join('')}</table>
 <h3>MCQ explanations</h3>${Q.slice(0,5).map((q,i)=>`<p style="font-size:13px"><b>Q${i+1}.</b> ${esc(q.q)} → <b>${'ABCD'[q.a]}. ${esc(q.o[q.a])}</b>. ${esc(q.why)}</p>`).join('')}
 <button class="b1" id="dl">Download report (.txt)</button> <button class="b2" id="nw">Start a new attempt</button>`;
 $('modal').classList.add('open');$('app').innerHTML='<div class="center"><div class="card"><h1>Exam complete</h1><p>Your result is shown in the dialog. Reload this page to reopen it.</p></div></div>';
 $('dl').onclick=()=>{let t=`BITWISE LAB RESULT\nName: ${S.cand.n}\nID: ${S.cand.r}\nScore: ${R.tot}/${max}\nViolations: ${S.viol}\n${S.log.join('\n')}\n\n`;
  R.rows.forEach(r=>{t+=`Q${r.i+1}: ${r.s}/${r.m} (${r.p}/${r.n} tests) ${r.msg}\n`;if(Q[r.i].t==='c')t+='----\n'+(S.ans[r.i]||'')+'\n----\n\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='bitwise_lab_result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $('nw').onclick=()=>{if(confirm('Clear this attempt from this browser? This cannot be undone.')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}}

S?run():start();
})();
</script>
